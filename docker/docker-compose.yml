# Day 0 skeleton. api / ui services are enabled in Week 2-3 once their code exists.
# Usage: make up   (reads ../.env)
name: pvrc

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfuse_data:/var/lib/postgresql/data]

  langfuse:
    image: langfuse/langfuse:2
    depends_on: [langfuse-db]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
      SALT: change-me
    ports: ["3000:3000"]

  # api:
  #   build: {context: .., dockerfile: docker/Dockerfile.api}
  #   env_file: ../.env
  #   depends_on: {db: {condition: service_healthy}}
  #   ports: ["8000:8000"]
  # ui:
  #   build: {context: .., dockerfile: docker/Dockerfile.ui}
  #   env_file: ../.env
  #   depends_on: [api]
  #   ports: ["8501:8501"]

volumes:
  pgdata:
  langfuse_data:
